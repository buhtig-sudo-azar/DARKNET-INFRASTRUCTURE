<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background -->
  <rect width="100" height="100" rx="20" fill="#0a0a0a"/>
  <!-- Spider web -->
  <g stroke="#7C3AED" stroke-width="0.8" fill="none" opacity="0.6">
    <!-- Radial lines -->
    <line x1="50" y1="50" x2="50" y2="8"/>
    <line x1="50" y1="50" x2="80" y2="15"/>
    <line x1="50" y1="50" x2="92" y2="50"/>
    <line x1="50" y1="50" x2="80" y2="85"/>
    <line x1="50" y1="50" x2="50" y2="92"/>
    <line x1="50" y1="50" x2="20" y2="85"/>
    <line x1="50" y1="50" x2="8" y2="50"/>
    <line x1="50" y1="50" x2="20" y2="15"/>
    <!-- Concentric rings -->
    <circle cx="50" cy="50" r="15"/>
    <circle cx="50" cy="50" r="25"/>
    <circle cx="50" cy="50" r="35"/>
    <circle cx="50" cy="50" r="42"/>
  </g>
  <!-- Spider body -->
  <g fill="#10B981">
    <!-- Abdomen -->
    <ellipse cx="50" cy="58" rx="6" ry="8" fill="#10B981"/>
    <!-- Cephalothorax -->
    <ellipse cx="50" cy="47" rx="4" ry="5" fill="#10B981"/>
    <!-- Head -->
    <circle cx="50" cy="41" r="2.5" fill="#10B981"/>
    <!-- Legs -->
    <g stroke="#10B981" stroke-width="1.5" fill="none" stroke-linecap="round">
      <!-- Left legs -->
      <path d="M47 47 Q38 40 30 35"/>
      <path d="M46 49 Q35 46 26 44"/>
      <path d="M46 53 Q35 54 26 58"/>
      <path d="M47 57 Q38 62 32 70"/>
      <!-- Right legs -->
      <path d="M53 47 Q62 40 70 35"/>
      <path d="M54 49 Q65 46 74 44"/>
      <path d="M54 53 Q65 54 74 58"/>
      <path d="M53 57 Q62 62 68 70"/>
    </g>
    <!-- Eyes -->
    <circle cx="48.5" cy="40.5" r="0.8" fill="#7C3AED"/>
    <circle cx="51.5" cy="40.5" r="0.8" fill="#7C3AED"/>
  </g>
</svg>
